services:
  stt:
    build: ./stt
    ports:
      - "8003:8003"
    volumes:
      - stt-models:/models
    environment:
      - STT_MODELS_DIR=/models
      - STT_MODEL_SIZE=base
      - STT_DEVICE=auto
      - STT_COMPUTE_TYPE=auto
      - CORS_ORIGINS=http://localhost:3000

  tts:
    build: ./tts
    ports:
      - "8004:8004"
    shm_size: "1gb"
    mem_limit: 12g
    volumes:
      - tts-models:/models
    environment:
      - HF_HOME=/models
      - TTS_MODEL_NAME=Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
      - TTS_DEVICE=auto
      - TTS_DTYPE=auto
      - CORS_ORIGINS=http://localhost:3000

volumes:
  stt-models:
  tts-models:
