[project]
name = "rag-mcp-server"
version = "0.1.0"
description = "MCP server for RAG document retrieval and ingestion"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.9.0",
    "qdrant-client>=1.15.1",
    "langchain-ollama>=1.0.1",
    "langchain-text-splitters>=1.0.0",
    "pypdf>=6.0.0",
    "pydantic-settings>=2.13.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
