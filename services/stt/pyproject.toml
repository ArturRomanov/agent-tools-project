[project]
name = "stt-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "faster-whisper>=1.1.0",
    "pydantic-settings>=2.13.1",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["../../tests/services/stt"]
addopts = "-q"
