[project]
name = "tts-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.13.1",
    "qwen-tts>=0.1.1",
    "soundfile>=0.13.0",
    "torch>=2.0.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["../../tests/services/tts"]
addopts = "-q"
